name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache wasi-sdk
        id: cache-wasi
        uses: actions/cache@v5
        with:
          path: ~/.cache/tree-sitter/wasi-sdk
          key: wasi-sdk-29

      - name: Download wasi-sdk if cache miss
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/tree-sitter
          curl -sL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            | tar -xzf - -C ~/.cache/tree-sitter

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate tree-sitter-pike.wasm
        run: |
          git clone https://github.com/TheSmuks/tree-sitter-pike /tmp/tree-sitter-pike
          cd /tmp/tree-sitter-pike
          bun build grammar.ts --outfile grammar.js --target node --format esm
          npm install -g tree-sitter-cli@0.26.8
          tree-sitter generate --js-runtime native
          tree-sitter build --wasm -o tree-sitter-pike.wasm
          ls -la tree-sitter-pike.wasm || { echo "ERROR: wasm not found"; exit 1; }
          mv tree-sitter-pike.wasm "$GITHUB_WORKSPACE/"

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test
